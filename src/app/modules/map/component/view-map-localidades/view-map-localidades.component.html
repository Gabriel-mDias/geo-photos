<div [ngClass]="isFullScreen ? 'layout-fullscreen' : 'layout'">
  <!-- Mapa -->
  <div id="leaflet-map" class="map"></div>
  <div class="map-base-toggle">
    <button type="button" class="btn btn-sm btn-light" [class.active]="baseLayer === 'osm'" (click)="setBaseLayer('osm')">
      OSM
    </button>
    <button type="button" class="btn btn-sm btn-light" [class.active]="baseLayer === 'esri'" (click)="setBaseLayer('esri')">
      Satélite
    </button>
  </div>

  <!-- Overlay do panorama -->
  <div class="viewer-overlay" *ngIf="selecionado">
    <div class="viewer-header">
      <span>{{ selecionado.nome }}</span>
      <button class="btn-fechar" (click)="fecharViewer()">Fechar</button>
    </div>
    <div #viewer class="viewer-container"></div>
  </div>
</div>
